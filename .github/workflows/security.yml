name: Security checks

on:
  push:
    branches: [main, codex/staging-preparation]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Artifact audit compares the approved historical tree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/audit-baseline.mjs --check
      - run: node scripts/check-commercial-migrations.mjs
      - run: npm run catalog:historical:check
      - run: npm run build:staging && node scripts/audit-guest-artifact.mjs
        env:
          STAGING_BACKEND_ORIGIN: https://matebreak-api-staging.onrender.com
      - run: npm audit --omit=dev --audit-level=high
