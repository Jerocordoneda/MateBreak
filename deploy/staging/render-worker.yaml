# Optional worker: assign the API staging env/secrets manually before initial deploy.
services:
  - type: worker
    name: matebreak-staging-logistics
    runtime: node
    branch: codex/staging-preparation
    plan: starter
    autoDeployTrigger: off
    buildCommand: npm ci
    startCommand: npm run start:staging:worker
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: APP_ENV
        value: staging
      - key: NODE_ENV
        value: development
      - key: SHIPPING_MODE
        value: mock
      - key: PAYMENTS_MODE
        value: mock
      - key: MATEBREAK_STAGING_PERSIST_MOCK
        value: '1'
      - key: MOCK_PAYMENT_RESULT
        value: approved
      - key: APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STAGING_PROJECT_REF
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
